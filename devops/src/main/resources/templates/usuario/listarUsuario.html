<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Usuários')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('usuarios')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/home}" class="voltar" title="Voltar para o início">&#8592;</a>
        <h1>Usuários</h1>
        <div class="acoes-topo">
            <a th:href="@{/usuarios/criar}" class="botao">+ Novo usuário</a>
        </div>
    </div>

    <div class="erro" th:if="${erro}" th:text="${erro}"></div>
    <div class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></div>

    <div class="tabela-caixa">
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Login</th>
                    <th>Perfil</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.idUsuario}">*</td>
                    <td th:text="${usuario.nomeUsuario}">*</td>
                    <td th:text="${usuario.emailUsuario}">*</td>
                    <td th:text="${usuario.loginUsuario}">*</td>
                    <td>
                        <span th:if="${usuario.role == 'ROLE_CLIENTE'}">Usuário normal</span>
                        <span th:if="${usuario.role == 'ROLE_USER'}">Administrador</span>
                    </td>
                    <td>
                        <a class="editar" th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}">Editar</a>
                        <a class="excluir" th:href="@{/usuarios/excluir/{id}(id=${usuario.idUsuario})}">Excluir</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="vazio">Nenhum usuário cadastrado</td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
