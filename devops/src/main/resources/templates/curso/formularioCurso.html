<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Cursos')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('cursos')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/cursos/listar}" class="voltar" title="Voltar para a lista">&#8592;</a>
        <h1 th:text="${curso.idCurso} == null ? 'Novo curso' : 'Editar curso'">Novo curso</h1>
    </div>

    <div class="cartao formulario">

        <div class="erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/cursos/salvar}" method="post" th:object="${curso}">

            <input type="hidden" th:field="*{idCurso}">

            <label>Nome</label>
            <input type="text" th:field="*{nomeCurso}" maxlength="100" required>

            <label>Período</label>
            <input type="text" th:field="*{periodoCurso}" maxlength="50" required>

            <label>Carga horária</label>
            <input type="number" th:field="*{cargaHorariaCurso}" min="1" required>

            <button type="submit" class="botao botao-largo">Salvar</button>

        </form>

    </div>

</main>

</body>
</html>
