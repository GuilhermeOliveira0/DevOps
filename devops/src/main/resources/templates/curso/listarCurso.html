<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Cursos')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('cursos')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/home}" class="voltar" title="Voltar para o início">&#8592;</a>
        <h1>Cursos</h1>
        <div class="acoes-topo">
            <a th:href="@{/cursos/criar}" class="botao">+ Novo curso</a>
        </div>
    </div>

    <div class="erro" th:if="${erro}" th:text="${erro}"></div>
    <div class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></div>

    <div class="tabela-caixa">
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Período</th>
                    <th>Carga horária</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="curso : ${cursos}">
                    <td th:text="${curso.idCurso}">*</td>
                    <td th:text="${curso.nomeCurso}">*</td>
                    <td th:text="${curso.periodoCurso}">*</td>
                    <td th:text="${curso.cargaHorariaCurso}">*</td>
                    <td>
                        <a class="editar" th:href="@{/cursos/editar/{id}(id=${curso.idCurso})}">Editar</a>
                        <a class="excluir" th:href="@{/cursos/excluir/{id}(id=${curso.idCurso})}">Excluir</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(cursos)}">
                    <td colspan="5" class="vazio">Nenhum curso cadastrado</td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
