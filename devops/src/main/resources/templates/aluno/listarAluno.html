<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Alunos')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('alunos')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/home}" class="voltar" title="Voltar para o início">&#8592;</a>
        <h1>Alunos</h1>
        <div class="acoes-topo">
            <a th:href="@{/alunos/criar}" class="botao">+ Novo aluno</a>
        </div>
    </div>

    <div class="erro" th:if="${erro}" th:text="${erro}"></div>
    <div class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></div>

    <div class="tabela-caixa">
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Endereço</th>
                    <th>CPF</th>
                    <th>RA</th>
                    <th>Curso</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="aluno : ${alunos}">
                    <td th:text="${aluno.idAluno}">*</td>
                    <td th:text="${aluno.nomeAluno}">*</td>
                    <td th:text="${aluno.emailAluno}">*</td>
                    <td th:text="${aluno.telefoneAluno}">*</td>
                    <td th:text="${aluno.enderecoAluno}">*</td>
                    <td th:text="${aluno.cpfAluno}">*</td>
                    <td th:text="${aluno.raAluno}">*</td>
                    <td th:text="${aluno.curso != null} ? ${aluno.curso.nomeCurso} : 'Sem curso'">*</td>
                    <td>
                        <a class="editar" th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}">Editar</a>
                        <a class="excluir" th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}">Excluir</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(alunos)}">
                    <td colspan="9" class="vazio">Nenhum aluno cadastrado</td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
