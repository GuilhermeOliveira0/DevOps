<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Alunos')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('alunos')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/alunos/listar}" class="voltar" title="Voltar para a lista">&#8592;</a>
        <h1 th:text="${aluno.idAluno} == null ? 'Novo aluno' : 'Editar aluno'">Novo aluno</h1>
    </div>

    <div class="cartao formulario">

        <div class="erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/alunos/salvar}" method="post" th:object="${aluno}">

            <input type="hidden" th:field="*{idAluno}">

            <label>Nome</label>
            <input type="text" th:field="*{nomeAluno}" maxlength="40" required>

            <label>Email</label>
            <input type="email" th:field="*{emailAluno}" maxlength="40" required>

            <label>Telefone</label>
            <input type="text" th:field="*{telefoneAluno}" maxlength="11" required>

            <label>Endereço</label>
            <input type="text" th:field="*{enderecoAluno}" maxlength="50" required>

            <label>CPF</label>
            <input type="text" th:field="*{cpfAluno}" maxlength="11" required>

            <label>RA</label>
            <input type="text" th:field="*{raAluno}" required>

            <label>Curso</label>
            <select th:field="*{curso}">
                <option value="">Selecione um curso</option>
                <option th:each="c : ${cursos}"
                        th:text="${c.nomeCurso}"
                        th:value="${c.idCurso}"></option>
            </select>

            <button type="submit" class="botao botao-largo">Salvar</button>

        </form>

    </div>

</main>

</body>
</html>
