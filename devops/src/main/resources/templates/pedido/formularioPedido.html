<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Pedidos')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('pedidos')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/pedidos/listar}" class="voltar" title="Voltar para a lista">&#8592;</a>
        <h1>Novo pedido</h1>
    </div>

    <div class="cartao formulario">

        <div class="erro" th:if="${erro}" th:text="${erro}"></div>

        <div class="erro" th:if="${#lists.isEmpty(alunos)}">
            Não há alunos cadastrados. Cadastre um aluno antes de abrir um pedido.
        </div>

        <form th:action="@{/pedidos/abrir}" method="post" th:unless="${#lists.isEmpty(alunos)}">

            <label>Aluno</label>
            <select name="idAluno" required>
                <option value="">Selecione o aluno</option>
                <option th:each="aluno : ${alunos}"
                        th:value="${aluno.idAluno}"
                        th:text="${aluno.idAluno} + ' - ' + ${aluno.nomeAluno}"></option>
            </select>

            <p class="ajuda">O pedido é aberto vazio; os produtos são lançados na tela seguinte.</p>

            <button type="submit" class="botao botao-largo">Abrir pedido</button>

        </form>

    </div>

</main>

</body>
</html>
