<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pedidos</title>
</head>
<body>
    <h1 style="text-align: center;">Formulário de Pedidos</h1>
 
    <datalist id="listaAlunos">
        <option th:each="aluno : ${alunos}"
                th:value="${aluno.idAluno + ' - ' + aluno.nomeAluno'}">
        </option>
    </datalist>
 
    <datalist id ="listaProdutos">
        <option th:each="produto : ${produto}"
                th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
                th:attr="data-preco=${produto.valorProduto}">
                </option>
        </datalist>
 
        <h1>Cadastro de Pedidos</h1>
        <a href="@{/home}">Votar</a>
 
        <p>I. Identificação do Aluno</p>
        <label for="aluno">Aluno:</label>
        <br/>
        <input list="listaAlunos" id="aluno" type="text" placeholder=" Digite o nome do aluno">
        <br/> <br/>
        <p>II. Identificação do Produto</p>
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" placeholder="0" min="1"> 
        <br/>
        <button type="button" onclik="adicionarItem()">

            <span> +</span> Adicionar 

        </button>
        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço Unitário</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="Tabela-itens">
    <td id="empty-row=5"> nenhum produto adicionado ao pedido </td> 
            </tr>    
        </tbody>   
        
    
</table>
<span> Total do pedido</span>
<span> R$</span><span id="totalPedido">0,00</span>
<br> </br>
            </tbody>
</body>
</html>
