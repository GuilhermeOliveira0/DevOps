<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Professores')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('professores')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/professores/listar}" class="voltar" title="Voltar para a lista">&#8592;</a>
        <h1 th:text="${professor.idProfessor} == null ? 'Novo professor' : 'Editar professor'">Novo professor</h1>
    </div>

    <div class="cartao formulario">

        <div class="erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/professores/salvar}" method="post" th:object="${professor}">

            <input type="hidden" th:field="*{idProfessor}">

            <label>Nome</label>
            <input type="text" th:field="*{nomeProfessor}" maxlength="40" required>

            <label>Telefone</label>
            <input type="text" th:field="*{telefoneProfessor}" maxlength="20" required>

            <label>Graduação</label>
            <input type="text" th:field="*{graduacaoProfessor}" maxlength="50" required>

            <label>RM</label>
            <input type="text" th:field="*{rmProfessor}" maxlength="50" required>

            <button type="submit" class="botao botao-largo">Salvar</button>

        </form>

    </div>

</main>

</body>
</html>
