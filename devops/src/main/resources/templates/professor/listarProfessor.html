<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Professores')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('professores')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/home}" class="voltar" title="Voltar para o início">&#8592;</a>
        <h1>Professores</h1>
        <div class="acoes-topo">
            <a th:href="@{/professores/criar}" class="botao">+ Novo professor</a>
        </div>
    </div>

    <div class="erro" th:if="${erro}" th:text="${erro}"></div>
    <div class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></div>

    <div class="tabela-caixa">
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Graduação</th>
                    <th>RM</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="professor : ${professores}">
                    <td th:text="${professor.idProfessor}">*</td>
                    <td th:text="${professor.nomeProfessor}">*</td>
                    <td th:text="${professor.telefoneProfessor}">*</td>
                    <td th:text="${professor.graduacaoProfessor}">*</td>
                    <td th:text="${professor.rmProfessor}">*</td>
                    <td>
                        <a class="editar" th:href="@{/professores/editar/{id}(id=${professor.idProfessor})}">Editar</a>
                        <a class="excluir" th:href="@{/professores/excluir/{id}(id=${professor.idProfessor})}">Excluir</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(professores)}">
                    <td colspan="6" class="vazio">Nenhum professor cadastrado</td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
