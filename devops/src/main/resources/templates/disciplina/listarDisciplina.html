<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Disciplinas')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('disciplinas')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/home}" class="voltar" title="Voltar para o início">&#8592;</a>
        <h1>Disciplinas</h1>
        <div class="acoes-topo">
            <a th:href="@{/disciplinas/criar}" class="botao">+ Nova disciplina</a>
        </div>
    </div>

    <div class="erro" th:if="${erro}" th:text="${erro}"></div>
    <div class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></div>

    <div class="tabela-caixa">
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Sigla</th>
                    <th>Carga horária</th>
                    <th>Curso</th>
                    <th>Professor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="disciplina : ${disciplinas}">
                    <td th:text="${disciplina.idDisciplina}">*</td>
                    <td th:text="${disciplina.nomeDisciplina}">*</td>
                    <td th:text="${disciplina.siglaDisciplina}">*</td>
                    <td th:text="${disciplina.cargaHorariaDisciplina}">*</td>
                    <td th:text="${disciplina.curso != null} ? ${disciplina.curso.nomeCurso} : 'Sem curso'">*</td>
                    <td th:text="${disciplina.professor != null} ? ${disciplina.professor.nomeProfessor} : 'Sem professor'">*</td>
                    <td>
                        <a class="editar" th:href="@{/disciplinas/editar/{id}(id=${disciplina.idDisciplina})}">Editar</a>
                        <a class="excluir" th:href="@{/disciplinas/excluir/{id}(id=${disciplina.idDisciplina})}">Excluir</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(disciplinas)}">
                    <td colspan="7" class="vazio">Nenhuma disciplina cadastrada</td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
