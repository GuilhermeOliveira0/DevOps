<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Disciplinas')}"></head>
<body>

<div th:replace="~{fragments/layout :: lateral('disciplinas')}"></div>

<main class="conteudo">

    <div class="topo">
        <a th:href="@{/disciplinas/listar}" class="voltar" title="Voltar para a lista">&#8592;</a>
        <h1 th:text="${disciplina.idDisciplina} == null ? 'Nova disciplina' : 'Editar disciplina'">Nova disciplina</h1>
    </div>

    <div class="cartao formulario">

        <div class="erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/disciplinas/salvar}" method="post" th:object="${disciplina}">

            <input type="hidden" th:field="*{idDisciplina}">

            <label>Nome</label>
            <input type="text" th:field="*{nomeDisciplina}" maxlength="40" required>

            <label>Sigla</label>
            <input type="text" th:field="*{siglaDisciplina}" maxlength="10" required>

            <label>Carga horária</label>
            <input type="number" th:field="*{cargaHorariaDisciplina}" min="1" required>

            <label>Curso</label>
            <select th:field="*{curso}">
                <option value="">Selecione um curso</option>
                <option th:each="c : ${cursos}"
                        th:text="${c.nomeCurso}"
                        th:value="${c.idCurso}"></option>
            </select>

            <label>Professor</label>
            <select th:field="*{professor}">
                <option value="">Selecione um professor</option>
                <option th:each="p : ${professores}"
                        th:text="${p.nomeProfessor}"
                        th:value="${p.idProfessor}"></option>
            </select>

            <button type="submit" class="botao botao-largo">Salvar</button>

        </form>

    </div>

</main>

</body>
</html>
