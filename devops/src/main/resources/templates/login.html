<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema | FatecADS</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<div class="centralizado">

    <div class="painel-central">

        <h1>FatecADS</h1>
        <p class="sub">Acesso ao sistema</p>

        <div class="erro" th:if="${param.error}">
            Usuário ou senha inválidos.
        </div>

        <div class="mensagem" th:if="${param.logout}">
            Você saiu do sistema.
        </div>

        <div class="mensagem" th:if="${param.cadastro}">
            Conta criada. Agora você já pode entrar.
        </div>

        <form method="post" th:action="@{/login}">

            <label for="username">Usuário</label>
            <input type="text" id="username" name="username"
                   placeholder="Digite seu usuário" required autofocus>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password"
                   placeholder="Digite sua senha" required>

            <button type="submit" class="botao botao-largo">Entrar</button>

        </form>

        <a th:href="@{/usuarios/criar}" class="link-secundario">Não tem conta? Cadastre-se</a>
        <a th:href="@{/fatecads}" class="link-secundario">&#8592; Voltar para a página inicial</a>

    </div>

</div>

</body>
</html>
